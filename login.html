<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDA - Inicio de Sesión</title>
    <link rel="icon" type="image/x-icon" href="Robot AIDA.jpg" />  <!-- ICONO DE LA PESTAÑA DE LA WEB-->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="Robot AIDA.jpg" alt="Logo AIDA" style="border-radius: 50%; width: 300px; height: 300px;">
        </div>
        <h1>AIDA</h1>
        <p>Tu apoyo para dominar tus exámenes</p>
    </header>
    <main>
        <section class="login-container">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required >  
                </div>
                <button type="submit" class="btn">Iniciar Sesión</button>
            </form>
            <p>¿No tienes cuenta? <a href="#">Regístrate</a></p>
        </section>
    </main>
    <footer>
        <p>© 2025 Estudia Fácil. Todos los derechos reservados por alumnos de la UTL.</p>
    </footer>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            // Simulación de inicio de sesión exitoso
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
